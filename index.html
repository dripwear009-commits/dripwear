<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DRIPWEAR Builder</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    .draggable {
      position: absolute;
      cursor: move;
      user-select: none;
    }
  </style>
</head>

<body class="bg-[#0b0b0b] text-white min-h-screen font-sans overflow-hidden">

  <div class="flex h-screen">

    <!-- SIDEBAR -->
    <div class="w-[320px] bg-black border-r border-white/10 p-6 overflow-y-auto">

      <!-- LOGO -->
      <div class="mb-10">
        <img
          src="logo.png"
          class="h-20 object-contain"
        />
      </div>


      <!-- VIEW SWITCH -->
      <div class="mb-10">

        <p class="text-sm uppercase tracking-[0.3em] text-white/40 mb-4">
          Choose View
        </p>

        <div class="grid grid-cols-2 gap-3">

          <button
            onclick="changeView('front')"
            class="bg-white text-black py-3 rounded-2xl font-bold"
          >
            Front
          </button>

          <button
            onclick="changeView('back')"
            class="bg-white/10 py-3 rounded-2xl font-bold"
          >
            Back
          </button>

        </div>

      </div>



      <!-- UPLOAD DESIGN -->
      <div class="mb-10">

        <p class="text-sm uppercase tracking-[0.3em] text-white/40 mb-4">
          Upload Design
        </p>

        <input
          id="designUpload"
          type="file"
          accept="image/*"
          class="block w-full text-sm"
        />

      </div>



      <!-- RESIZE -->
      <div class="mb-10">

        <p class="text-sm uppercase tracking-[0.3em] text-white/40 mb-4">
          Resize Design
        </p>

        <input
          type="range"
          min="50"
          max="350"
          value="140"
          id="sizeSlider"
          class="w-full"
        />

      </div>



      <!-- ORDER BUTTON -->
      <button
        onclick="sendOrder()"
        class="w-full bg-white text-black py-4 rounded-2xl font-bold text-lg"
      >
        Send Order
      </button>

    </div>




    <!-- MAIN PREVIEW -->
    <div class="flex-1 flex items-center justify-center p-10">

      <div
        class="bg-[#111111] border border-white/10 rounded-[40px] w-full h-full flex items-center justify-center relative overflow-hidden"
      >

        <!-- CAPTURE AREA -->
        <div
          id="captureArea"
          class="relative"
        >

          <!-- SHIRT -->
          <img
            id="shirtImage"
            src="front.png"
            class="w-[600px] select-none"
            draggable="false"
          />



          <!-- DESIGN -->
          <img
            id="logoDesign"
            class="draggable hidden"
            style="
              width:140px;
              top:220px;
              left:230px;
            "
          />

        </div>

      </div>

    </div>

  </div>




  <script>

    const shirtImage = document.getElementById('shirtImage')
    const designUpload = document.getElementById('designUpload')
    const logoDesign = document.getElementById('logoDesign')
    const sizeSlider = document.getElementById('sizeSlider')



    // FRONT / BACK SWITCH
    function changeView(view) {

      if(view === 'front') {
        shirtImage.src = 'front.png'
      }

      if(view === 'back') {
        shirtImage.src = 'back.png'
      }

    }



    // UPLOAD DESIGN
    designUpload.addEventListener('change', function(e) {

      const file = e.target.files[0]

      if(file) {

        const reader = new FileReader()

        reader.onload = function(event) {

          logoDesign.src = event.target.result

          logoDesign.classList.remove('hidden')

        }

        reader.readAsDataURL(file)

      }

    })



    // RESIZE DESIGN
    sizeSlider.addEventListener('input', function() {

      logoDesign.style.width = this.value + 'px'

    })



    // DRAG SYSTEM
    let isDragging = false
    let offsetX
    let offsetY



    logoDesign.addEventListener('mousedown', (e) => {

      isDragging = true

      offsetX = e.offsetX
      offsetY = e.offsetY

    })



    document.addEventListener('mousemove', (e) => {

      if (!isDragging) return

      const parentRect =
        logoDesign.parentElement.getBoundingClientRect()

      logoDesign.style.left =
        (e.clientX - parentRect.left - offsetX) + 'px'

      logoDesign.style.top =
        (e.clientY - parentRect.top - offsetY) + 'px'

    })



    document.addEventListener('mouseup', () => {

      isDragging = false

    })



    // SEND ORDER
    function sendOrder() {

      html2canvas(document.getElementById('captureArea'))
        .then(canvas => {

          // DOWNLOAD IMAGE
          const link = document.createElement('a')

          link.download = 'dripwear-design.png'

          link.href = canvas.toDataURL()

          link.click()



          // OPEN EMAIL
          window.location.href =
            'mailto:d.r.i.p.wear009@gmail.com?subject=Custom%20Tshirt%20Order&body=Please%20attach%20the%20downloaded%20mockup%20PNG%20to%20this%20mail.'

        })

    }

  </script>

</body>
</html>
